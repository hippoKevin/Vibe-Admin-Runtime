name: CI · Client

on:
  push:
    branches: [main, develop]
    paths:
      - 'ADMINCLIENT/**'
      - '.github/workflows/ci-client.yml'
  pull_request:
    paths:
      - 'ADMINCLIENT/**'
      - '.github/workflows/ci-client.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-client-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 类型检查 · 构建
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ADMINCLIENT
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 配置 Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ADMINCLIENT/package-lock.json

      - name: 打印环境信息
        run: |
          node -v
          npm -v

      - name: 安装依赖
        run: npm ci

      # 生产构建必须通过（vite build）
      - name: 构建
        run: npm run build-only

      # 注意：仓库目前存在约 100 处历史遗留类型错误（vue-tsc），
      # 因此类型检查先只做提示、不阻断流水线；清理完成后删掉
      # continue-on-error 即可升级为强制检查。
      - name: 类型检查（暂不阻断）
        run: npm run type-check
        continue-on-error: true

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: client-dist
          path: ADMINCLIENT/dist
          retention-days: 7
