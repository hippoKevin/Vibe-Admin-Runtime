name: CI · Client

on:
  push:
    branches: [main, develop]
    paths:
      - 'ADMINCLIENT/**'
      - '.github/workflows/ci-client.yml'
  pull_request:
    paths:
      - 'ADMINCLIENT/**'
      - '.github/workflows/ci-client.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-client-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 类型检查 · 构建
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ADMINCLIENT
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 配置 Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ADMINCLIENT/package-lock.json

      - name: 安装依赖
        run: npm ci

      # npm run build = vue-tsc 类型检查 + vite 构建
      - name: 类型检查与构建
        run: npm run build

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: client-dist
          path: ADMINCLIENT/dist
          retention-days: 7
