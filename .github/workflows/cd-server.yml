name: CD · Server

on:
  # 手动触发（可选分支、可只重启不拉代码）
  workflow_dispatch:
    inputs:
      branch:
        description: 部署分支
        required: false
        default: main
        type: string
      skip_git:
        description: 跳过 git 拉取（仅重新构建与重启）
        required: false
        default: false
        type: boolean
  # 推送 v* 标签时自动部署
  push:
    tags:
      - 'v*'

permissions:
  contents: read

# 部署不允许并发，避免两个进程同时构建 / 重启
concurrency:
  group: cd-server
  cancel-in-progress: false

jobs:
  deploy-server:
    name: 部署后端（SSH + PM2）
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: 检查必需的 Secrets
        run: |
          missing=""
          [ -n "${{ secrets.SSH_HOST }}" ] || missing="$missing SSH_HOST"
          [ -n "${{ secrets.SSH_USER }}" ] || missing="$missing SSH_USER"
          [ -n "${{ secrets.SSH_PRIVATE_KEY }}" ] || missing="$missing SSH_PRIVATE_KEY"
          [ -n "${{ vars.DEPLOY_PATH }}" ] || missing="$missing DEPLOY_PATH(vars)"
          if [ -n "$missing" ]; then
            echo "::error::缺少配置：$missing（见 ADMINSERVER/cicd/README.md）"
            exit 1
          fi

      - name: 准备 SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${{ secrets.SSH_PORT || '22' }}" -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: 远程执行部署脚本
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          DEPLOY_BRANCH: ${{ github.event.inputs.branch || 'main' }}
          PM2_APP_NAME: ${{ vars.PM2_APP_NAME || 'main' }}
          SKIP_GIT: ${{ github.event.inputs.skip_git == 'true' && '1' || '0' }}
        run: |
          ssh -p "${SSH_PORT}" "${SSH_USER}@${SSH_HOST}" \
            "cd '${DEPLOY_PATH}' \
             && DEPLOY_BRANCH='${DEPLOY_BRANCH}' \
                PM2_APP_NAME='${PM2_APP_NAME}' \
                SKIP_GIT='${SKIP_GIT}' \
                bash ADMINSERVER/cicd/deploy.sh"

  deploy-client:
    name: 发布前端（可选）
    runs-on: ubuntu-latest
    needs: deploy-server
    # 只有仓库变量 DEPLOY_WEB=true 时才执行，避免没配站点目录就跑失败
    if: ${{ vars.DEPLOY_WEB == 'true' }}
    steps:
      - name: 检查必需的 Secrets
        run: |
          missing=""
          [ -n "${{ vars.WEB_PATH }}" ] || missing="$missing WEB_PATH(vars)"
          if [ -n "$missing" ]; then
            echo "::error::缺少配置：$missing（见 ADMINSERVER/cicd/README.md）"
            exit 1
          fi

      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 配置 Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ADMINCLIENT/package-lock.json

      - name: 构建前端
        working-directory: ADMINCLIENT
        run: |
          npm ci
          npm run build

      - name: 准备 SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${{ secrets.SSH_PORT || '22' }}" -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: 上传 dist 到站点目录
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          WEB_PATH: ${{ vars.WEB_PATH }}
        run: |
          rsync -az --delete -e "ssh -p ${SSH_PORT}" \
            ADMINCLIENT/dist/ "${SSH_USER}@${SSH_HOST}:${WEB_PATH}/"
